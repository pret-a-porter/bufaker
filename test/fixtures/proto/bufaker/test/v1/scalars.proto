syntax = "proto3";

package bufaker.test.v1;

// Every proto scalar type, exactly once, so the scalar mapping table can be
// verified exhaustively.
message AllScalars {
  double double_field = 1;
  float float_field = 2;
  int32 int32_field = 3;
  int64 int64_field = 4;
  uint32 uint32_field = 5;
  uint64 uint64_field = 6;
  sint32 sint32_field = 7;
  sint64 sint64_field = 8;
  fixed32 fixed32_field = 9;
  fixed64 fixed64_field = 10;
  sfixed32 sfixed32_field = 11;
  sfixed64 sfixed64_field = 12;
  bool bool_field = 13;
  string string_field = 14;
  bytes bytes_field = 15;
}

// int64 variants carrying jstype=JS_STRING, which makes protobuf-es emit
// `string` instead of `bigint`.
message StringifiedInt64 {
  int64 big = 1 [jstype = JS_STRING];
  uint64 ubig = 2 [jstype = JS_STRING];
}

// Explicit presence (proto3 optional) on scalars.
message OptionalScalars {
  optional string maybe_string = 1;
  optional int32 maybe_int = 2;
  optional bool maybe_bool = 3;
}
